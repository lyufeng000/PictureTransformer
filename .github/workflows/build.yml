name: Build PictureTransformer

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v6

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore .\PictureTransformer.sln

      - name: 编译项目
        run: dotnet build .\PictureTransformer.sln -c Release --no-restore

      - name: 构建 Setup 和 MSI
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\build-setup.ps1

      - name: 计算 SHA256
        shell: powershell
        run: |
          Get-FileHash .\dist\PictureTransformer-Setup.exe -Algorithm SHA256
          Get-FileHash .\dist\PictureTransformer.msi -Algorithm SHA256

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: PictureTransformer-unsigned-${{ github.sha }}
          path: |
            dist/PictureTransformer-Setup.exe
            dist/PictureTransformer.msi
          if-no-files-found: error
          retention-days: 30
