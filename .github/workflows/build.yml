name: Build PictureTransformer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v6

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore .\PictureTransformer.sln

      - name: 编译项目
        run: dotnet build .\PictureTransformer.sln -c Release --no-restore

      - name: 构建 Setup 和 MSI
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\build-setup.ps1

      - name: 计算 SHA256
        shell: powershell
        run: |
          Get-FileHash .\dist\PictureTransformer-Setup.exe -Algorithm SHA256
          Get-FileHash .\dist\PictureTransformer.msi -Algorithm SHA256

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: PictureTransformer-unsigned-${{ github.sha }}
          path: |
            dist/PictureTransformer-Setup.exe
            dist/PictureTransformer.msi
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 获取源码
        uses: actions/checkout@v6

      - name: 下载安装包
        uses: actions/download-artifact@v7
        with:
          name: PictureTransformer-unsigned-${{ github.sha }}
          path: dist

      - name: 创建 GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = ".\.github\release-notes\$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesFile)) {
            throw "找不到发行说明：$notesFile"
          }
          if (-not (Test-Path -LiteralPath ".\update.md")) {
            throw "找不到软件内更新说明：.\update.md"
          }
          gh release create $env:GITHUB_REF_NAME `
            .\dist\PictureTransformer-Setup.exe `
            .\dist\PictureTransformer.msi `
            --verify-tag `
            --latest `
            --title "PictureTransformer $env:GITHUB_REF_NAME" `
            --notes-file $notesFile
